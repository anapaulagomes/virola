[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vir"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Ana Paula Gomes Ferreira" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "aeon>=1.3.0",
    "datasets>=4.4.2",
    "duckdb>=1.3.2",
    "einops>=0.8.1",
    "embedding-atlas>=0.9.0",
    "h5py>=3.14.0",
    "hdbscan>=0.8.40",
    "ipython>=9.5.0",
    "llm>=0.27.1",
    "loguru",
    "marimo>=0.17.6",
    "numpy==2.2",
    "openai>=1.101.0",
    "pip",
    "plotly[express]>=6.2.0",
    "polars>=1.32.3",
    "polars-u64-idx>=1.32.3",
    "pyarrow>=21.0.0",
    "pytest",
    "python-dotenv",
    "ruff",
    "sentence-transformers>=5.1.0",
    "setfit>=1.1.3",
    "snfpy>=0.2.2",
    "sqlglot>=27.10.0",
    "torch>=2.8.0",
    "tqdm",
    "transformers>=4.55.0",
    "typer",
    "umap-learn>=0.5.9.post2",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["vir"]
include = ["pyproject.toml", "vir/**/*.py"]

[tool.ruff.lint.isort]
known-first-party = ["vir"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
]
