[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vir"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Ana Paula Gomes Ferreira" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "loguru",
    "marimo>=0.14.16",
    "numpy>=2.3.2",
    "pip",
    "plotly[express]>=6.2.0",
    "polars>=1.32.2",
    "pytest",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["vir"]
include = ["pyproject.toml", "vir/**/*.py"]

[tool.ruff.lint.isort]
known-first-party = ["vir"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
]
